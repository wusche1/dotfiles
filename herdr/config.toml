onboarding = false
[theme]
name = "kanagawa"

[keys]
prefix = "ctrl+space"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
settings = "prefix+comma"
new_workspace = "prefix+alt+s"
close_workspace = "prefix+shift+x"
rename_workspace = "prefix+shift+e"
close_tab = "prefix+ampersand"
new_worktree = "prefix+shift+w"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+ctrl+1..9"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "ctrl+h"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
navigate_pane_right = "ctrl+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "julian.new-workspace.create"
description = "new workspace in projects dir"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["index", "branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["index", "agent"]]
