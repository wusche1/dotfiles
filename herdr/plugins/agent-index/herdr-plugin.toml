id = "julian.agent-index"
name = "Agent index"
description = "Number agents across local and saved machines in agent-panel order, exposed as $aidx."
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "sync.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "sync.py"]

[[events]]
on = "pane.exited"
command = ["python3", "sync.py"]

[[events]]
on = "workspace.created"
command = ["python3", "sync.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "sync.py"]

[[events]]
on = "workspace.reordered"
command = ["python3", "sync.py"]

[[actions]]
id = "refresh"
title = "Refresh agent numbers"
contexts = ["workspace"]
command = ["python3", "sync.py"]
