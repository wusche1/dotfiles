id = "julian.new-workspace"
name = "New workspace"
description = "Create a workspace in /workspace if it exists, else ~/Projects."
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[actions]]
id = "create"
title = "New workspace in projects dir"
contexts = ["workspace"]
command = ["sh", "-c", "d=/workspace; [ -d $d ] || d=~/Projects; \"$HERDR_BIN_PATH\" workspace create --cwd $d --focus"]
